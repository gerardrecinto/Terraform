name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform-validate:
    name: Validate Terraform modules
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Check formatting
        run: |
          find . -name '*.tf' -not -path '*/.terraform/*' | xargs -I{} dirname {} | sort -u | while read dir; do
            terraform fmt -check -diff "$dir" || { echo "Format error in $dir"; exit 1; }
          done

      - name: Validate modules
        run: |
          for mod in AWS/modules/*/ Azure/modules/*/ GCP/modules/*/ AliCloud/modules/*/ OpenStack/modules/*/ on-prem/modules/*/ secure-connectivity/modules/*/; do
            echo "Validating $mod..."
            cd "$mod"
            terraform init -backend=false -input=false -no-color
            terraform validate -no-color
            cd - > /dev/null
          done

      - name: Check for hardcoded secrets
        run: |
          if grep -rn --include='*.tf' -E '(aws_access_key_id|aws_secret_access_key|password\s*=\s*"[^"]{8,}")' .; then
            echo 'ERROR: Potential hardcoded credentials found'
            exit 1
          fi
          echo 'No hardcoded credentials detected'

      - name: Trivy IaC misconfig scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
